# =============================================================================
# AI Scheduling Engine - Operational Mode (Phase 1)
# =============================================================================
# در این فاز هیچ ارزش‌گذاری مالی یا ارزش بیمار اعمال نمی‌شود.
# موتور فقط بر اساس تناسب نوبت (Slot Fit) تصمیم می‌گیرد.

# =============================================================================
# Legacy Weights (غیرفعال در این فاز)
# =============================================================================
weights:
  payment: 0.0
  treatment: 0.0
  lifetime: 0.0

# =============================================================================
# Risk Penalties (غیرفعال)
# =============================================================================
penalties:
  no_show: 0
  late_payment: 0

# =============================================================================
# Value Boosts (غیرفعال)
# =============================================================================
boosts:
  high_value: 0

# =============================================================================
# Confidence Thresholds (بدون تغییر)
# =============================================================================
confidence:
  high: 0.80
  medium: 0.60
  low: 0.40

# =============================================================================
# Risk Thresholds (بدون تغییر - ولی استفاده نمی‌شوند)
# =============================================================================
risk_thresholds:
  no_show:
    high: 0.30
    medium: 0.15
    low: 0.05
  late_payment:
    high: 0.25
    medium: 0.10
    low: 0.03

# =============================================================================
# Value Score Thresholds (استفاده نمی‌شوند)
# =============================================================================
value_thresholds:
  high: 80
  medium: 50
  low: 30

# =============================================================================
# Slot Recommendation Settings (فعال)
# =============================================================================
slot_recommendation:
  max_suggestions: 5
  min_suggestions: 3
  prefer_morning: true
  prefer_afternoon: false
  avoid_lunch_hours: true
  lunch_start: "13:00"
  lunch_end: "14:00"

# =============================================================================
# Scheduling Constraints (فعال)
# =============================================================================
scheduling:
  min_slot_duration: 15
  max_slot_duration: 240
  default_slot_duration: 30
  buffer_between_appointments: 5

# =============================================================================
# Time Preferences (فعال)
# =============================================================================
time_preferences:
  morning: 1.0
  afternoon: 0.8
  evening: 0.6

# =============================================================================
# Urgency Levels (فقط در صورت استفاده از فوریت)
# =============================================================================
urgency_weights:
  critical: 1.0
  high: 0.8
  medium: 0.5
  low: 0.3

# =============================================================================
# Payment Type Weights (غیرفعال)
# =============================================================================
payment_weights:
  cash: 1.0
  insurance_tier_1: 1.0
  insurance_tier_2: 1.0
  insurance_tier_3: 1.0

# =============================================================================
# Decision Engine V2 - Operational Mode
# =============================================================================
# Patient Value Score کاملاً غیرفعال است.

tvs:
  alpha: 0.0
  beta: 0.0
  gamma: 0.0
  epsilon: 0.0
  delta: 0.0

# Final Score فقط بر اساس تناسب نوبت محاسبه می‌شود
final:
  patient_weight: 0.0
  slot_weight: 1.0